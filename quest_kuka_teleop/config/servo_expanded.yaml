# Tuned profile used for physical teleop (expanded workspace, faster motion).
# Pass with servo_config:=$(ros2 pkg prefix --share quest_kuka_teleop)/config/servo_expanded.yaml
servo_node:
  ros__parameters:
    moveit_servo:
      move_group_name: manipulator
      publish_period: 0.01
      max_expected_latency: 0.1
      command_in_type: speed_units
      scale:
        linear: 0.1
        rotational: 0.3
        joint: 0.2
      incoming_command_timeout: 0.1
      pose_tracking:
        linear_tolerance: 0.001
        angular_tolerance: 0.01
      command_out_topic: /joint_trajectory_controller/joint_trajectory
      command_out_type: trajectory_msgs/JointTrajectory
      publish_joint_positions: true
      publish_joint_velocities: true
      publish_joint_accelerations: false
      joint_topic: /joint_states
      is_primary_planning_scene_monitor: true
      check_collisions: true
      self_collision_proximity_threshold: 0.01
      scene_collision_proximity_threshold: 0.02
      collision_check_rate: 10.0
      lower_singularity_threshold: 35.0
      hard_stop_singularity_threshold: 60.0
      joint_limit_margins:
      - 0.12
      halt_all_joints_in_cartesian_mode: true
      override_velocity_scaling_factor: 0.65
      use_smoothing: true
      smoothing_filter_plugin_name: online_signal_smoothing::ButterworthFilterPlugin

